steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/agents:$COMMIT_SHA", "agents"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/agents:$COMMIT_SHA"]

  - id: deploy-hello-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - beta
      - run
      - jobs
      - deploy
      - hello-agent
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/agents:$COMMIT_SHA
      - --region=us-central1
      - --functional-type=agent
      - --identity-type=agent-identity
      - --service-account=vibe2prod-agent-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=AGENT=hello,GOOGLE_GENAI_USE_ENTERPRISE=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --max-retries=0
      - --task-timeout=10m

  - id: deploy-codeguard-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - beta
      - run
      - jobs
      - deploy
      - codeguard-agent
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/agents:$COMMIT_SHA
      - --region=us-central1
      - --functional-type=agent
      - --identity-type=agent-identity
      - --service-account=vibe2prod-agent-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=AGENT=codeguard,STAGE=codeguard,GOOGLE_GENAI_USE_ENTERPRISE=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --cpu=2
      - --memory=4Gi
      - --max-retries=0
      - --task-timeout=40m

  - id: deploy-architect-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - beta
      - run
      - jobs
      - deploy
      - architect-agent
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/agents:$COMMIT_SHA
      - --region=us-central1
      - --functional-type=agent
      - --identity-type=agent-identity
      - --service-account=vibe2prod-agent-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=AGENT=architect,STAGE=architect,GOOGLE_GENAI_USE_ENTERPRISE=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --cpu=2
      - --memory=4Gi
      - --max-retries=0
      - --task-timeout=40m

  - id: deploy-iac-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - beta
      - run
      - jobs
      - deploy
      - iac-agent
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/agents:$COMMIT_SHA
      - --region=us-central1
      - --functional-type=agent
      - --identity-type=agent-identity
      - --service-account=vibe2prod-agent-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=AGENT=iac,STAGE=iac,GOOGLE_GENAI_USE_ENTERPRISE=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --cpu=2
      - --memory=4Gi
      - --max-retries=0
      - --task-timeout=40m

  - id: deploy-deploy-agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - beta
      - run
      - jobs
      - deploy
      - deploy-agent
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/agents:$COMMIT_SHA
      - --region=us-central1
      - --functional-type=agent
      - --identity-type=agent-identity
      - --service-account=vibe2prod-agent-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=AGENT=deploy,STAGE=deploy,GOOGLE_GENAI_USE_ENTERPRISE=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global
      - --cpu=2
      - --memory=4Gi
      - --max-retries=0
      - --task-timeout=40m

  - id: build-dashboard
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/dashboard:$COMMIT_SHA", "web"]

  - id: push-dashboard
    name: gcr.io/cloud-builders/docker
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/dashboard:$COMMIT_SHA"]

  - id: deploy-dashboard
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - vibe2prod-dashboard
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/vibe2prod/dashboard:$COMMIT_SHA
      - --region=us-central1
      - --service-account=vibe2prod-dashboard@$PROJECT_ID.iam.gserviceaccount.com
      - --no-invoker-iam-check
      - --set-secrets=APPROVER_KEYS=dashboard-approver-keys:latest
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,REGION=us-central1
      - --timeout=3600
      - --max-instances=3

options:
  logging: CLOUD_LOGGING_ONLY
